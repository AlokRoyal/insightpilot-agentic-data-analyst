name: Weekly public data refresh

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas requests
      - name: Refresh World Bank snapshot
        run: PYTHONPATH=src python -c "from insight_pilot.data import refresh_data; print(refresh_data())"
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/world_bank_indicators.csv
          if git diff --cached --quiet; then
            echo "No new observations; nothing to commit."
          else
            git commit -m "data: refresh World Bank indicators"
            git push
          fi
