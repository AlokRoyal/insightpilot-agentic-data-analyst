name: Daily agentic code evolution

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openai
      - name: Check for the API secret
        id: api-key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; skipping the daily proposal."
          fi
      - name: Generate one bounded extension proposal
        if: steps.api-key.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini
        run: python scripts/daily_agent.py
      - name: Validate Python syntax
        if: steps.api-key.outputs.available == 'true'
        run: python -m compileall -q src/insight_pilot/extensions
      - name: Open a draft pull request
        if: steps.api-key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_DATE: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "daily-agent/${UPDATE_DATE}"
          git add src/insight_pilot/extensions/*.py
          if git diff --cached --quiet; then
            echo "No new extension was generated."
            exit 0
          fi
          git commit -m "feat: propose daily analytics extension"
          git push --set-upstream origin HEAD
          gh pr create --draft --title "Daily analytics extension proposal" --body "Generated by the bounded InsightPilot enhancement agent. Review the source and its output before merging. This workflow never commits generated code directly to main."
